<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ClipABit - Login Failed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 28px 56px 52px;
            min-height: 200px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 420px;
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
        }
        .logo svg {
            display: block;
            transform: translateX(12px);
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ff6b6b;
            letter-spacing: -0.3px;
        }
        p {
            color: #9ca3af;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .hint {
            font-size: 13px;
            color: #6b7280;
            margin-top: 24px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">LOGO_SVG_PLACEHOLDER</div>
        <h1>Login Failed</h1>
        <p>Authentication was cancelled or an error occurred.</p>
        <p class="hint">You can close this tab and try again.</p>
    </div>
</body>
</html>
