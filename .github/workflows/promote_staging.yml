name: Promote staging to main

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type for main (patch, minor, major)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: verify staging CI
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'ci.yml';
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch: 'staging',
              per_page: 1,
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed('No CI runs found for staging.');
              return;
            }
            const latest = runs.data.workflow_runs[0];
            if (latest.conclusion !== 'success') {
              core.setFailed(`Latest staging CI is ${latest.conclusion}.`);
            }

      - name: checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: merge staging into main
        run: |
          git fetch origin staging
          git merge --no-ff origin/staging -m "chore: promote staging to main"
          git push origin HEAD:main

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: semantic release (main)
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer@11
            @semantic-release/release-notes-generator@12
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            @semantic-release/github@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
