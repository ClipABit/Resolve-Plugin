name: trigger-installer-on-release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch-installer:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch installer build for released tag
        env:
          INSTALLER_TRIGGER_TOKEN: ${{ secrets.INSTALLER_TRIGGER_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INSTALLER_TRIGGER_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ClipABit/installer/dispatches \
            -d "$(jq -nc --arg release_tag \"${RELEASE_TAG}\" '{event_type:"resolve_plugin_release", client_payload:{release_tag:$release_tag}}')"
