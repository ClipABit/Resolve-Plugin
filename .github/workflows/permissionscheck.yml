name: Permissions Probe

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe write permissions
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const tagName = `permissions-probe-${context.run_id}`;
            const ref = `refs/tags/${tagName}`;

            core.info(`Attempting to create tag ${ref} at ${sha}`);
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref,
                sha,
              });
              core.info("Tag created successfully.");
            } catch (error) {
              core.setFailed(`Failed to create tag: ${error.message}`);
              return;
            }

            core.info(`Attempting to delete tag ${ref}`);
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });
              core.info("Tag deleted successfully.");
            } catch (error) {
              core.setFailed(`Failed to delete tag: ${error.message}`);
            }
