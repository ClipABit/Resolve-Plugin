name: ci

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install ruff
        run: pip install ruff

      - name: lint
        run: ruff check clipabit.py clipabit/ watch_clipabit.py
      - name: syntax check
        run: python -m compileall clipabit.py clipabit/ watch_clipabit.py
